services:
  - type: web
    name: football-posture-analysis
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 180 app:app
    healthCheckPath: /health
    envVars:
      - {key: SECRET_KEY, generateValue: true}
      - {key: DATABASE_URL, sync: false}
      - {key: SENTRY_DSN, sync: false}
      - {key: RATE_LIMIT_PER_MINUTE, value: "90"}
